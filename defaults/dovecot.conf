# Generic Dovecot configuration.
# Rendered at startup from /etc/dovecot-defaults.tmpl/dovecot.conf via envsubst.
# Override anything by mounting a replacement at /etc/dovecot-overlay/dovecot.conf
# or by dropping snippets into /etc/dovecot-overlay/conf.d/.

# Protocols
protocols = imap pop3 lmtp

# Logging — stdout/stderr only (convention §5).
log_path = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/stdout

# Listen on all interfaces inside the container.
listen = *

# SSL/TLS
ssl = yes
ssl_cert = <${DOVECOT_TLS_CERT}
ssl_key = <${DOVECOT_TLS_KEY}
ssl_min_protocol = TLSv1.2

# Authentication
auth_mechanisms = ${DOVECOT_AUTH_MECHANISMS}
disable_plaintext_auth = no

# Passdb / userdb: SQL-backed by default. Replace via overlay if you want
# passwd-file or LDAP — drop a /etc/dovecot-overlay/conf.d/auth.conf snippet.
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# Mail location: Maildir, scoped per-domain/per-user.
mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = 5000
mail_gid = 5000
mail_privileged_group = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# Standard IMAP namespace with the canonical special-use folders.
namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

# LMTP service (for delivery from an MTA).
service lmtp {
  inet_listener lmtp {
    address = 0.0.0.0
    port = 24
  }
}

# Auth service exposed for SASL clients (e.g. an MTA doing SMTP AUTH).
service auth {
  inet_listener {
    address = 0.0.0.0
    port = 12345
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins
  postmaster_address = postmaster@${DOVECOT_DOMAIN}
}

protocol imap {
  mail_max_userip_connections = 20
}
